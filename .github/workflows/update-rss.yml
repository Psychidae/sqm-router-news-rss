name: Update router and network RSS feeds

on:
  schedule:
    # Twice an hour. GitHub Actions cron uses UTC.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RSS feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python src/generate_all_feeds.py --manifest config/feeds.json --index-output docs/index.html

      - name: Commit updated feeds
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: update published feeds"
          git push
